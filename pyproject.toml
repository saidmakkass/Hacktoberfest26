[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "barakagate"
version = "1.0.0"
description = "Open-weight multimodal pre-flight security, privacy & cross-file logical bug gate powered by Gemma 4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0", "fastapi>=0.110", "uvicorn>=0.27", "typer>=0.12", "rich>=13",
  "pydantic>=2.5", "pyyaml>=5.4", "pillow>=10", "httpx>=0.27", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
barakagate = "barakagate.cli:app"

[tool.setuptools]
packages = ["barakagate"]

[tool.setuptools.package-data]
barakagate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

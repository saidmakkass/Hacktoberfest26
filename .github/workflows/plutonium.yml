name: Plutonium
on:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  plutonium:
    name: Required policy review
    runs-on: ubuntu-latest
    steps:
      # Run trusted scanner code. Never install or execute code from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted scanner
        run: pip install .
      - name: Fetch proposed objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch origin "refs/pull/$PR_NUMBER/head:refs/plutonium/proposed"
      - name: Check proposed revision with base policy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .plutonium
          plutonium check --base "$BASE_SHA" --head refs/plutonium/proposed > .plutonium/review-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plutonium-review
          path: .plutonium/review-report.json
          if-no-files-found: ignore
